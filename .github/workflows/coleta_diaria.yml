name: Coleta diária — CLDF e DODF

on:
  schedule:
    - cron: "0 9 * * *"   # 06h Brasília
  workflow_dispatch:

concurrency:
  group: coleta-diaria
  cancel-in-progress: false

permissions:
  contents: read
  issues: write            # para abrir issue automática em caso de falha

jobs:
  testes:
    name: Testes rápidos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v

  coletar-cldf:
    name: Proposições CLDF (API oficial)
    runs-on: ubuntu-latest
    needs: testes
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Rodar coletor CLDF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scrapers/coletor_cldf.py

  coletar-dodf:
    name: Publicações DODF
    runs-on: ubuntu-latest
    needs: testes
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Rodar coletor DODF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scrapers/coletor_dodf.py

  alerta-falha:
    name: Abrir issue se algo falhou
    runs-on: ubuntu-latest
    needs: [coletar-cldf, coletar-dodf]
    if: failure()
    steps:
      - name: Criar issue de alerta
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = `Coleta falhou — ${new Date().toISOString().slice(0,10)}`;
            const existentes = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'coleta-falhou'
            });
            if (existentes.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: titulo,
                labels: ['coleta-falhou'],
                body: `Uma ou mais coletas falharam.\n\nVer logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nVerifique também a tabela \`coleta_log\` no Supabase para o detalhe do erro.`
              });
            }
