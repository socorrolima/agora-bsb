name: Coleta semanal — Transparência GDF

on:
  schedule:
    - cron: "0 10 * * 1"  # segunda 07h Brasília
  workflow_dispatch:

concurrency:
  group: coleta-semanal
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  coletar-transparencia:
    name: Orçamento e emendas GDF
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Rodar coletor Transparência
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scrapers/coletor_transparencia.py

  alerta-falha:
    runs-on: ubuntu-latest
    needs: coletar-transparencia
    if: failure()
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const existentes = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'coleta-falhou'
            });
            if (existentes.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Coleta Transparência falhou — ${new Date().toISOString().slice(0,10)}`,
                labels: ['coleta-falhou'],
                body: `Logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
            }
